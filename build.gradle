plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version "${forge_gradle_version}"
    id 'org.spongepowered.mixin' version "${mixin_gradle_version}"
    id 'wtf.gofancy.fancygradle' version "${fancy_gradle_version}"
}

version = mod_version
group = mod_id
base.archivesName = mod_name

java.toolchain.languageVersion = JavaLanguageVersion.of(8)

minecraft {
    mappings channel: mappings_channel, version: mappings_version

    runs {
        server {
            jvmArg "-Dfml.coreMods.load=${mixin_loader_class}"
//            jvmArg "-Dmixin.hotSwap=true"
            jvmArg "-Dmixin.checks.interfaces=true"
            jvmArg "-Dmixin.debug.export=true"

            workingDirectory project.file('run')

            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'debug'
        }

        client {
            parent minecraft.runs.server

            args "--username=InDev"
        }

        clientAllMods {
            parent minecraft.runs.client

            workingDirectory project.file('runPack')
        }

        serverAllMods {
            parent minecraft.runs.server

            workingDirectory project.file('runPack')
        }
    }
}

repositories {
    flatDir { dirs 'libs' }
    maven { url = 'https://www.cursemaven.com' }
    maven { url = "https://maven.k-4u.nl" }
}

def runOptionalMods = gradle.startParameter.taskNames.any { it.startsWith('run') && it.endsWith('AllMods')}
def requiredImplementation = [
        "curse.maven:fermiumbooter-${fermiumbooter_version}",
        "curse.maven:lycanitesmobs-${lycanitesmobs_version}"
]
def optionalRuntime = [

]
def optionalImplementation = [
        "com.github.mcjty:mcjtytools:${mcjtytools_version}",
        "curse.maven:llibrary-${llibrary_version}",
        "curse.maven:iceandfire-rlcraft-${iceandfirerl_version}",
        "curse.maven:atomicstrykers-battle-towers-${battletowers_version}",
        "curse.maven:baubles-${baubles_version}",
        "curse.maven:bloodmoon-${bloodmoon_version}",
        "curse.maven:claimitapi-${claimitapi_version}",
        "curse.maven:collision-damage-${collisiondamage_version}",
        "curse.maven:distinct-damage-descriptions-${ddd_version}", // TODO wait for FermiumBooter update. FB remove "mixin.ddd.json" config for now for indev runs.
        "curse.maven:electroblobs-wizardry-${ebw_version}",
        "curse.maven:in-control-${incontrol_version}",
        "curse.maven:jei-${jei_version}",
        "curse.maven:potioncore-${potioncore_version}",
        "curse.maven:reachfix-${reachfix_version}",
        "curse.maven:rlcombat-${rlcombat_version}",
//        "curse.maven:rltweaker2-${rltweaker_version}",  // Disable the BetterCombat patches, they are removed indev
        "libs:RLTweaker:1.12.2-0.7.5-indev", // I got tired of generating a config
        "curse.maven:shieldbreak-${shieldbreak_version}",
        "curse.maven:so-many-enchantments-${sme_version}",
        "curse.maven:scape-and-run-parasites-${srparasites_version}",
        "curse.maven:switch-bow-${switchbow_version}"
]

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    compileOnly  "org.spongepowered:mixin:${mixin_version}"
    annotationProcessor "org.spongepowered:mixin:${mixin_version}:processor"
    compileOnly  "io.github.llamalad7:mixinextras-common:${mixin_extras_version}"
    annotationProcessor "io.github.llamalad7:mixinextras-common:${mixin_extras_version}"

    requiredImplementation.each { dep ->
        implementation fg.deobf(dep)
    }

    optionalRuntime.each { dep ->
        if (runOptionalMods) runtimeOnly fg.deobf(dep)
    }
    optionalImplementation.each { dep ->
        if (runOptionalMods) implementation fg.deobf(dep)
        else compileOnly fg.deobf(dep)
    }

    fg.deobf("curse.maven:iceandfire-rotn-${iceandfirerotn_version}") // But ensure compat with these
    fg.deobf("curse.maven:iceandfire-${iceandfire_version}") // But ensure compat with these
}

mixin {
    add sourceSets.main, "mixins.${mod_id}.refmap.json"
}

fancyGradle {
    patches {
        resources
        coremods
        asm
        mergetool
    }
}

// Start indev run helpers
// Mappings for Bloodmoons
def mcpMappingsDir = file('mcp')

tasks.register('prepareMinecraftMappings', Copy) {
    dependsOn 'extractMappings'
    from(layout.buildDirectory.dir('extractMappings')) {
        include 'fields.csv'
        include 'methods.csv'
    }
    into(mcpMappingsDir)
}

tasks.configureEach {
    if (name.startsWith('prepareRun')) {
        dependsOn 'prepareMinecraftMappings'
    }
}

// CurseForge pack zip import for runServer testing: run manually with `gradlew curseForgeTestPack` after building a fresh jar
def cursePackDir = layout.buildDirectory.dir('cursePack')
def runPackServersDat = file('runPack/servers.dat')

tasks.register('stageCurseTestPack') {
    def stagingDir = cursePackDir
    outputs.dir stagingDir
    outputs.upToDateWhen { false }
    doLast {
        def mods = (requiredImplementation + optionalRuntime + optionalImplementation)
                .findAll { it.startsWith('curse.maven:') }
                .unique()
                .collect { entry ->
                    def matcher = (entry =~ /^curse\.maven:(.+)-(\d+):(\d+)$/)
                    if (!matcher.find()) throw new GradleException("Cannot export CurseForge pack: invalid coordinate ${entry}")
                    [slug: matcher.group(1), projectID: matcher.group(2) as long, fileID: matcher.group(3) as long]
                }

        def out = stagingDir.get().asFile
        out.deleteDir()
        out.mkdirs()

        def files = mods.collect { [projectID: it.projectID, fileID: it.fileID, required: true] }
        def manifest = [
                'name'           : mod_name + " indev Client",
                'version'        : mod_version,
                'author'         : mod_author.replaceAll(/^\[|\]$/, ''),
                'overrides'      : 'overrides',
                'manifestType'   : 'minecraftModpack',
                'manifestVersion': 1,
                'minecraft'      : [
                        'version'   : minecraft_version,
                        'modLoaders': [[id: "forge-${forge_version}", primary: true]]
                ],
                'files'          : files
        ]
        new File(out, 'manifest.json').text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(manifest)) + '\n'

        def modlist = new StringBuilder('<ul>\n')
        mods.each { modlist << "  <li>${it.slug} (${it.projectID}:${it.fileID})</li>\n" }
        modlist << '</ul>\n'
        new File(out, 'modlist.html').text = modlist.toString()

        // Pre-seed the multiplayer server list (copy the canonical libs/servers.dat verbatim, if present)
        def serversDatSrc = file('libs/servers.dat')
        if (serversDatSrc.isFile()) {
            def serversDat = serversDatSrc.bytes
            def overridesDir = new File(out, 'overrides')
            overridesDir.mkdirs()
            new File(overridesDir, 'servers.dat').bytes = serversDat
            runPackServersDat.bytes = serversDat
        }

        def packModsDir = new File(new File(out, 'overrides'), 'mods')
        packModsDir.mkdirs()
        def libsDir = layout.buildDirectory.dir('libs').get().asFile
        def builtJar = libsDir.listFiles()
                .findAll { it.name.startsWith("${mod_name}-${mod_version}") && it.name.endsWith('.jar') }
                .max { it.lastModified() }
        if (builtJar == null) throw new GradleException("Cannot export CurseForge pack: no built jar in ${libsDir}")
        def builtZip = new java.util.zip.ZipFile(builtJar)
        try {
            if (builtZip.getEntry("mixins.${mod_id}.refmap.json") == null)
                throw new GradleException("Cannot export CurseForge pack: ${builtJar.name} is missing mixins.${mod_id}.refmap.json - run `gradlew.bat clean build` first")
        } finally {
            builtZip.close()
        }
        new File(packModsDir, builtJar.name).bytes = builtJar.bytes
    }
}

def curseForgeTestPack = tasks.register('curseForgeTestPack', Zip) {
    dependsOn 'stageCurseTestPack'
    archiveFileName = "${mod_name}-${mod_version}-indev-client-pack.zip"
    destinationDirectory = layout.buildDirectory.dir('distributions')
    from cursePackDir
    preserveFileTimestamps = false
}

// End indev run helpers

processResources {
    var replaceProperties = [
            'mod_id': mod_id,
            'mod_name': mod_name,
            'version': mod_version,
            'mcversion': minecraft_version,
            'mod_description': mod_description,
            'mod_author': mod_author
    ]

    inputs.properties replaceProperties

    filesMatching('mcmod.info') {
        expand replaceProperties
    }
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : mod_name,
                "Specification-Version"   : "1",
                "Specification-Vendor"   : mod_author,
                "Implementation-Title"    : mod_name,
                "Implementation-Version"  : mod_version,
                "Implementation-Vendor"   : mod_author,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),

                // --- only use if you need a coremod ---
                "FMLCorePlugin": mixin_loader_class,
                "FMLCorePluginContainsFMLMod": "true", // this tells forge that you got both a normal @Mod AND a coremod

                // ---
                // These will construct the coremod a bit later (tweaker stage, after plugin stage)
                // and will allow to use Mixins.addConfiguration during coremod init.
                // Not needed for using FermiumRegistryAPI.enqueue, which achieves the same using late=false.
                // So you most probably won't need this.
                // ---
                // Using this also forces you to use the build task before shipping,
                // as using runClient or runServer creates a jar that only works indev (and vice versa)
                // ---
//            "TweakClass": "org.spongepowered.asm.launch.MixinTweaker",
//            "ForceLoadAsMod": gradle.startParameter.taskNames.any { !it.startsWith('runClient') && !it.startsWith('runServer')}
        ])
    }
}

// Forces Mixin annotation to always run and generate refmap, related discussion https://github.com/SpongePowered/Mixin/issues/48
tasks.named('compileJava') {
    options.incremental = false
}

jar.finalizedBy('reobfJar')